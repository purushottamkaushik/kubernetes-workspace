apiVersion: v1
kind: Service
metadata:
  name: fleetman-queue

spec:
  # this represent which pods are going to represented by this service
  # The service become a network endpoint for either other services
  # or maybe for external users to connect to [ eg browser ]
  selector:
    app: queue

  ports:
    - name: http
      port: 8161
      nodePort: 30010

    - name: endpoint
      port: 61616

  type: NodePort

---

apiVersion: v1
