
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-release
spec:
  minReadySeconds: 20
  selector:
    matchLabels:
      app: webapp
  replicas: 2
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: richardchesterwood/k8s-fleetman-webapp-angular:release0
          ports:
            - containerPort: 80
---


apiVersion: v1
kind: Pod
metadata:
  name: fleetman-queue
  labels:
    app: queue

spec:
  containers:
    - name: fleet-queue
      image: richardchesterwood/k8s-fleetman-queue:release1
      ports:
        - containerPort: 80




