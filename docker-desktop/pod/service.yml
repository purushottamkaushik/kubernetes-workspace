apiVersion: v1
kind: Service
metadata:
  name: fleetman-webapp-svc

spec:
  # this represent which pods are going to represented by this service
  # The service become a network endpoint for either other services
  # or maybe for external users to connect to [ eg browser ]
  selector:
    app: webapp
  ports:
      - name: http
        port: 80
        nodePort: 30080

  type: NodePort

---

apiVersion: v1
kind: Service
metadata:
  name: fleetman-queue-svc

spec:
  # this represent which pods are going to represented by this service
  # The service become a network endpoint for either other services
  # or maybe for external users to connect to [ eg browser ]
  selector:
    app: queue

  ports:
    - name: http
      port: 8161
      nodePort: 30010

  type: NodePort

